[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cuttersnap"
version = "0.1.0"
description = "Turn a photo of a cookie into a sturdy, smooth, 3D-printable cookie cutter. Classical computer vision, no AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "shapely>=2.0",
  "trimesh>=4.0",
  "manifold3d>=2.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "pillow-heif>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cuttersnap = "cuttersnap.cli:main"

[tool.setuptools.packages.find]
include = ["cuttersnap*"]

[tool.setuptools.package-data]
cuttersnap = ["static/*", "static/vendor/*"]
