name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]  # a version tag publishes :0.1.0, :0.1 and :latest, then the release
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PrusaSlicer for the blade slicing check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends prusa-slicer
      - run: pip install -e '.[dev]'
      - run: pytest -q
        env:
          CUTTERSNAP_REQUIRE_SLICER: "1"

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write  # creates the GitHub release on a version tag
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cuttersnap-local
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          # run it the way the README says, with the designs volume
          docker run -d --name cs -p 8080:8080 -v cuttersnap-designs:/data cuttersnap-local
          for i in $(seq 30); do curl -sf localhost:8080/api/health && break; sleep 2; done
          # the data folder must be writable by the image's user, and designs need a sign-in
          curl -sf -c jar -H 'Content-Type: application/json' -d '{"username":"smoke","password":"smoke-test-pw"}' \
              localhost:8080/api/signup \
            && curl -sf -b jar localhost:8080/api/designs | grep -q '^\[\]$' && docker exec cs test -w /data/designs \
            && test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/designs)" = 401 \
            || { docker logs cs; exit 1; }
      # a version tag must match both version fields and have notes, before anything is published
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -f "docs/releases/$TAG.md" || { echo "missing docs/releases/$TAG.md"; exit 1; }
          py=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          pkg=$(grep -m1 '^__version__' cuttersnap/__init__.py | cut -d'"' -f2)
          if [ "$py" != "${TAG#v}" ] || [ "$pkg" != "${TAG#v}" ]; then
            echo "pyproject.toml ($py) and cuttersnap/__init__.py ($pkg) must both say ${TAG#v}"; exit 1
          fi
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/addison16/cuttersnap
          # main -> latest; tag v0.1.0 -> 0.1.0 and 0.1 (and latest, as main's newest)
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # publish only after the smoke test passed; the same layers come from cache
      - name: Publish multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create the GitHub release from its notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "CutterSnap $TAG" --notes-file "docs/releases/$TAG.md" --verify-tag
